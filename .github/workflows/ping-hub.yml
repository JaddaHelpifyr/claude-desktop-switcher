name: Ping the hub

# Tells https://sevin47.github.io to refresh this project's card as soon as
# something lands here, instead of waiting for the hub's daily sync.
#
# Needs a HUB_TOKEN secret on this repo: a fine-grained personal access token
# with Contents: read and write on Sevin47/Sevin47.github.io and nothing else.
# Without that secret this job exits quietly and the daily sync still covers it.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ping-hub
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Notify the hub
        env:
          HUB_TOKEN: ${{ secrets.HUB_TOKEN }}
        run: |
          if [ -z "$HUB_TOKEN" ]; then
            echo "No HUB_TOKEN secret on this repo, so there is nothing to notify."
            echo "The hub picks this up in its daily sync instead."
            exit 0
          fi
          code=$(curl -sS -o /tmp/resp -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $HUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/Sevin47/Sevin47.github.io/dispatches \
            -d '{"event_type":"project-updated"}')
          if [ "$code" = "204" ]; then
            echo "Hub notified."
          else
            echo "Hub refused the ping with HTTP $code:"
            cat /tmp/resp
            exit 1
          fi
