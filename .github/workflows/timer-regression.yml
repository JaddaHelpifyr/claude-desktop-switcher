name: Windows PowerShell timer regression

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  timer-lifecycle:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Windows PowerShell 5.1 timer lifecycle test
        shell: powershell
        run: .\tests\timer-lifecycle-regression.ps1
