name: Windows PowerShell regression tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  regression:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Windows PowerShell 5.1 regression suite
        shell: powershell
        run: .\tests\claude-sessions-regression.ps1
